# Change note: publish the maintained fork as `rtreesearch` while preserving the `treesearch` Rust crate name.
[package]
name = "rtreesearch"
version = "1.1.2"
edition = "2021"
description = "Structure-aware document search library and optional CLI over hierarchical document trees."
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/DDGRCF/TreeSearch"
documentation = "https://docs.rs/rtreesearch"
repository = "https://github.com/DDGRCF/TreeSearch"
keywords = ["search", "fts5", "bm25", "tree", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "treesearch"
path = "src/lib.rs"

[[bin]]
name = "ts"
path = "src/main.rs"
required-features = ["cli"]

[features]
# Preserve `cargo install treesearch` and the upstream CLI experience by
# default, while allowing embedding applications to select only what they use.
default = ["cli"]
cli = [
    "cjk-jieba",
    "directory-indexer",
    "output",
    "parsers-all",
    "progress",
    "sqlite-bundled",
    "dep:clap",
    "dep:tracing-subscriber",
]
directory-indexer = ["sqlite-fts", "dep:ignore", "dep:rayon"]
progress = ["directory-indexer", "dep:indicatif"]
output = ["dep:serde_json", "dep:termcolor", "dep:unicode-width"]
sqlite-fts = ["dep:md-5", "dep:rusqlite", "dep:serde_json", "dep:tracing"]
sqlite-bundled = ["sqlite-fts", "rusqlite/bundled"]
cjk-jieba = ["dep:jieba-rs", "dep:tracing"]
parser-markdown = ["dep:pulldown-cmark"]
parser-plaintext = []
parser-html = ["dep:ego-tree", "dep:scraper"]
parser-config = ["dep:serde_json", "dep:serde_yaml", "dep:toml"]
parser-code = []
parsers-all = [
    "parser-code",
    "parser-config",
    "parser-html",
    "parser-markdown",
    "parser-plaintext",
]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"], optional = true }

# SQLite + FTS5
rusqlite = { version = "0.37", default-features = false, optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }

# File discovery
ignore = { version = "0.4", optional = true }

# Parallel processing
rayon = { version = "1.10", optional = true }

# CJK tokenization
jieba-rs = { version = "0.9", optional = true }

# Regex
regex = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Terminal output
termcolor = { version = "1", optional = true }
unicode-width = { version = "0.1", optional = true }

# Progress bar
indicatif = { version = "0.18", optional = true }

# HTML parsing
scraper = { version = "0.27", optional = true }
ego-tree = { version = "0.11", optional = true }

# Markdown parsing
pulldown-cmark = { version = "0.12", optional = true }

# Content hashing
md-5 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
